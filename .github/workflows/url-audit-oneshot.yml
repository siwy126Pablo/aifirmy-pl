name: URL Audit (one-shot)
on: workflow_dispatch
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Run URL audit
        env:
          SUPABASE_URL:      ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: php scraper/url_audit.php
      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: url-audit-report
          path: scraper/reports/*.csv
