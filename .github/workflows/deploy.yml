name: Deploy to Cyberfolks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submit_all:
        description: 'IndexNow: zgłoś wszystkie URL-e z sitemapy (zamiast samej różnicy)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      # IndexNow: deploy rusza przy każdym pushu (także docs-only), więc do Binga
      # zgłaszamy tylko różnicę między sitemapą z produkcji (sprzed deployu)
      # a sitemapą z nowego builda. Oba kroki IndexNow nigdy nie wywracają deployu.
      - name: IndexNow — snapshot sitemapy z produkcji
        id: indexnow_old
        continue-on-error: true
        run: |
          set -uo pipefail
          : > old-urls.txt
          : > old-urls.tmp
          fetch() { curl -fsS --max-time 30 --retry 2 -A "aifirmy-deploy (GitHub Actions)" "$1"; }
          locs() { grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's/<\/loc>//'; }
          skip() { echo "::warning::IndexNow: $1 — diff zostanie pominięty"; exit 0; }

          index=$(fetch https://aifirmy.pl/sitemap-index.xml) || skip "nie udało się pobrać sitemap-index.xml z produkcji"
          for sm in $(printf '%s' "$index" | locs | grep -E '^https://aifirmy\.pl/sitemap-[0-9]+\.xml$'); do
            fetch "$sm" | locs >> old-urls.tmp || skip "nie udało się pobrać lub odczytać $sm"
          done
          [ -s old-urls.tmp ] || skip "sitemapa z produkcji nie zawiera żadnych URL-i"

          LC_ALL=C sort -u old-urls.tmp > old-urls.txt
          echo "fetched=true" >> "$GITHUB_OUTPUT"
          echo "IndexNow: $(wc -l < old-urls.txt) URL-i w sitemapie produkcyjnej sprzed deployu"

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: s103.cyber-folks.pl
          username: siwy126
          password: ${{ secrets.SSH_PASSWORD }}
          port: 222
          source: frontend/dist/*
          target: /home/siwy126/domains/aifirmy.pl/public_html/
          strip_components: 2

      - name: Generate narzedzia manifest
        run: ls frontend/dist/narzedzia > frontend/manifest-narzedzia.txt

      - name: Upload narzedzia manifest
        uses: appleboy/scp-action@v0.1.7
        with:
          host: s103.cyber-folks.pl
          username: siwy126
          password: ${{ secrets.SSH_PASSWORD }}
          port: 222
          source: frontend/manifest-narzedzia.txt
          target: /home/siwy126/
          strip_components: 1

      - name: Fix permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: s103.cyber-folks.pl
          username: siwy126
          password: ${{ secrets.SSH_PASSWORD }}
          port: 222
          script: |
            find /home/siwy126/domains/aifirmy.pl/public_html -type d -exec chmod 755 {} \;
            find /home/siwy126/domains/aifirmy.pl/public_html -type f -exec chmod 644 {} \;

      - name: Clean up orphaned narzedzia pages
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: s103.cyber-folks.pl
          username: siwy126
          password: ${{ secrets.SSH_PASSWORD }}
          port: 222
          script: |
            set -euo pipefail
            MANIFEST="/home/siwy126/manifest-narzedzia.txt"
            TARGET_DIR="/home/siwy126/domains/aifirmy.pl/public_html/narzedzia"
            if [ ! -f "$MANIFEST" ]; then
              echo "Manifest nie istnieje, przerywam bez usuwania niczego"
              exit 1
            fi
            LINE_COUNT=$(wc -l < "$MANIFEST")
            if [ "$LINE_COUNT" -lt 10 ]; then
              echo "Manifest ma podejrzanie mało pozycji ($LINE_COUNT), przerywam bez usuwania niczego"
              exit 1
            fi
            cd "$TARGET_DIR"
            for d in */; do
              slug="${d%/}"
              if ! grep -qxF "$slug" "$MANIFEST"; then
                echo "usuwam osierocone: $slug"
                rm -rf -- "$slug"
              fi
            done
            rm -f "$MANIFEST"

      - name: Deploy admin panel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: s103.cyber-folks.pl
          username: siwy126
          password: ${{ secrets.SSH_PASSWORD }}
          port: 222
          # + wspólna stała z regułami jakości promptów (używa jej verify_tool.php; źródło w scraper/lib/)
          source: admin/,scraper/lib/quality_rules.php
          target: /home/siwy126/domains/aifirmy.pl/public_html/
          strip_components: 0

      - name: IndexNow — zgłoszenie zmienionych URL-i
        continue-on-error: true
        env:
          SUBMIT_ALL: ${{ inputs.submit_all == true }}
          OLD_FETCHED: ${{ steps.indexnow_old.outputs.fetched }}
          # Klucz IndexNow jest publiczny z definicji (leży w frontend/public/), to nie sekret
          INDEXNOW_KEY: 0f56fbd2a21b7e471ec892fee4c82d6c
        run: |
          set -uo pipefail
          locs() { grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's/<\/loc>//'; }

          : > new-urls.tmp
          for f in frontend/dist/sitemap-*.xml; do
            # sitemap-index.xml też pasuje do globa, a jego <loc> to pliki sitemapy, nie strony
            if [ "$(basename "$f")" = "sitemap-index.xml" ]; then continue; fi
            locs < "$f" >> new-urls.tmp || true
          done
          LC_ALL=C sort -u new-urls.tmp > new-urls.txt
          if [ ! -s new-urls.txt ]; then
            echo "::warning::IndexNow: brak URL-i w zbudowanej sitemapie (frontend/dist/sitemap-*.xml) — nic nie zgłaszam"
            exit 0
          fi

          if [ "$SUBMIT_ALL" = "true" ]; then
            echo "IndexNow: submit_all=true — zgłaszam wszystkie URL-e z nowej sitemapy"
            cp new-urls.txt submit-urls.txt
          elif [ "$OLD_FETCHED" != "true" ]; then
            echo "::warning::IndexNow: brak sitemapy produkcyjnej sprzed deployu — diff pominięty, nic nie zgłaszam"
            exit 0
          else
            LC_ALL=C comm -13 old-urls.txt new-urls.txt > added-urls.txt
            LC_ALL=C comm -23 old-urls.txt new-urls.txt > removed-urls.txt
            echo "IndexNow: dodane $(wc -l < added-urls.txt), usunięte $(wc -l < removed-urls.txt)"
            cat added-urls.txt removed-urls.txt > submit-urls.txt
          fi

          if [ ! -s submit-urls.txt ]; then
            echo "::notice::IndexNow: brak zmian, pomijam"
            exit 0
          fi

          echo "IndexNow: zgłaszam $(wc -l < submit-urls.txt) URL-i, pierwsze 10:"
          head -n 10 submit-urls.txt

          # Limit protokołu: 10 000 URL-i na żądanie
          split -l 10000 submit-urls.txt indexnow-batch-
          for batch in indexnow-batch-*; do
            jq -Rn --arg key "$INDEXNOW_KEY" \
              '{host: "aifirmy.pl", key: $key, keyLocation: ("https://aifirmy.pl/" + $key + ".txt"), urlList: [inputs]}' \
              < "$batch" > indexnow-payload.json
            code=$(curl -s -o indexnow-response.txt -w '%{http_code}' --max-time 30 \
              -X POST -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @indexnow-payload.json https://www.bing.com/indexnow) || true
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then
              echo "::notice::IndexNow: zgłoszono $(wc -l < "$batch") URL-i, HTTP $code"
            else
              echo "::warning::IndexNow: zgłoszenie $(wc -l < "$batch") URL-i nieudane, HTTP $code: $(head -c 300 indexnow-response.txt 2>/dev/null)"
            fi
          done